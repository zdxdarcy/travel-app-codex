<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f8">
  <meta name="description" content="查看当前行程，记录实际完成情况和旅途备注">

        <span>旅程</span>

        <span class="sync-state" id="syncState" data-state="loading"><span class="status-dot"></span><span id="syncText">正在读取</span></span>
        <button class="icon-button" id="refreshButton" type="button" aria-label="刷新行程" title="刷新行程">↻</button>

    <main class="main-content">

    <nav class="bottom-nav" aria-label="主导航">

      </a>
      <a class="nav-item" href="../06-用户与PWA/index.html#trips" data-nav="trips">

      <a class="nav-item" href="../06-用户与PWA/index.html#account" data-nav="account">
        <span class="nav-icon" aria-hidden="true">○</span><span>我的</span>

    </nav>
